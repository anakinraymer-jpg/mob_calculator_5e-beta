  <!-- Ensure flt-glass-pane fills its flutter-view container.
       Also patch requestAnimationFrame to use setTimeout so Flutter renders
       even in environments where the tab is not the active rendering target. -->
  <style>
    flt-glass-pane { display: block; position: absolute; inset: 0; }
  </style>
  <script>
    (function () {
      // Some embedded/automated preview hosts report document.visibilityState
      // as 'visible' without ever actually compositing a frame, so native
      // requestAnimationFrame silently never fires and Flutter never paints.
      // Rather than trust that signal, race native RAF against a timeout on
      // every frame — whichever fires first wins. In a normal browser native
      // RAF wins almost every time (~16ms), so real users still get proper
      // vsync-timed frames; in a host that never composites, the fallback
      // guarantees Flutter still pumps frames instead of hanging forever.
      var _raf = window.requestAnimationFrame;
      window.requestAnimationFrame = function (cb) {
        var fired = false;
        var timeoutId = setTimeout(function () {
          if (fired) return;
          fired = true;
          cb(performance.now());
        }, 100);
        return _raf(function (t) {
          if (fired) return;
          fired = true;
          clearTimeout(timeoutId);
          cb(t);
        });
      };
    })();
  </script>

</body>
